name: suspecto
description: A modern offline-first imposter party word game built with Flutter.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/suspecto-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/suspecto-icon.png
  adaptive_icon_background: '#6C4DFF'
  adaptive_icon_foreground: assets/branding/suspecto-icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/suspecto-icon.png
    background_color: '#6C4DFF'
    theme_color: '#6C4DFF'
